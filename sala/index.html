<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Únete a la sala · Kultureta</title>
<meta name="description" content="Te han invitado a un Concurso en directo en Kultureta.">
<meta property="og:title" content="¡Te han invitado a un Concurso en Kultureta!">
<meta property="og:description" content="Toca para entrar en la sala y jugar en directo.">
<style>
  :root { --bg1:#5B33B8; --bg2:#3B0F7A; --bg3:#14052F; --gold1:#FFE7A3; --gold2:#D9A93F; --gold3:#8A6118; --ink:#2A1A05; --cream:#FFF4D6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--cream);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%); }
  .card { width:100%; max-width:380px; text-align:center; padding:28px 22px; border-radius:26px;
    border:3px solid var(--gold2); background: rgba(20,5,47,.55); box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); }
  img { width:88px; height:88px; border-radius:22px; }
  h1 { font-size:1.5rem; margin:14px 0 6px; color: var(--gold1); }
  p { margin:0 0 18px; opacity:.92; }
  .code { display:inline-block; font-size:2rem; font-weight:900; letter-spacing:.25em; padding:6px 16px 6px 22px;
    border:2px dashed var(--gold2); border-radius:14px; margin-bottom:20px; color:#fff; }
  .btn { display:block; width:100%; padding:15px; border-radius:999px; font-weight:900; font-size:1.1rem; text-decoration:none;
    background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, #B9842A); color: var(--ink); box-shadow: 0 4px 0 var(--gold3); }
  .alt { display:block; margin-top:16px; color: var(--gold1); font-size:.92rem; }
  .small { font-size:.85rem; opacity:.8; margin-top:18px; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.svg" alt="Kultureta">
    <h1>¡Te han invitado a un Concurso!</h1>
    <p>Toca el botón para entrar en la sala y jugar en directo.</p>
    <div class="code" id="code">·····</div>
    <a class="btn" id="open" href="#">Entrar en la sala</a>
    <a class="alt" id="store" href="https://play.google.com/store/apps/details?id=com.javier.kultureta">¿No tienes Kultureta? Descárgala en Google Play</a>
    <p class="small">Si no se abre, entra en Kultureta → Duelos → Aceptar un reto y escribe el código.</p>
  </main>
<script>
  (function () {
    var m = location.search.match(/[?&]c=([A-Za-z0-9]{5})/);
    var code = m ? m[1].toUpperCase() : '';
    var store = 'https://play.google.com/store/apps/details?id=com.javier.kultureta';
    document.getElementById('code').textContent = code || '—';
    var android = /android/i.test(navigator.userAgent);
    var appUrl = android
      ? 'intent://sala/' + code + '#Intent;scheme=kultureta;package=com.javier.kultureta;S.browser_fallback_url=' + encodeURIComponent(store) + ';end'
      : 'kultureta://sala/' + code;
    var btn = document.getElementById('open');
    btn.href = code ? appUrl : store;
    // Se intenta abrir la app sola; si el navegador no lo permite, queda el botón
    if (code && android) setTimeout(function () { location.href = appUrl; }, 300);
  })();
</script>
</body>
</html>
